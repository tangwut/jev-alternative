name: Feature request
description: Propose a concrete use case or improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user and real task, not only the proposed implementation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
